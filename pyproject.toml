[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bmkgaw"
version = "0.1.0"
description = "bmkgaw — unofficial Info BMKG API wrapper (FastAPI + httpx): app API + official open-data portals"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "pandamoon21" }]
keywords = ["bmkg", "weather", "indonesia", "earthquake", "gempa", "maritim", "api", "wrapper", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
]

[project.scripts]
bmkgaw = "bmkgaw:main"

[tool.setuptools]
py-modules = ["bmkgaw"]
