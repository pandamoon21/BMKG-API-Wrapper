app = "bmkgaw"
primary_region = "sin"

[build]

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  min_machines_running = 1
  [[http_service.ports]]
    handlers = ["http"]
    port = 80
  [[http_service.ports]]
    handlers = ["tls", "http"]
    port = 443

# Optional persistent cache volume — uncomment after `fly volumes create bmkgaw_data --size 1`
# and set BMKGAW_CACHE_BACKEND=sqlite BMKGAW_CACHE_DB_URL=sqlite:////data/bmkgaw_cache.db
# [mounts]
#   source = "bmkgaw_data"
#   destination = "/data"
